# 리더 선출은 Lease 오브젝트를 만들고(create) 자기 것으로 갱신(update/patch)하며
# 남의 임대 상태를 확인(get/list/watch)한다. 그래서 coordination.k8s.io 의 leases 에
# 대한 권한만 있으면 되고, 그 외 권한은 필요 없다(EventRecorder 를 안 써서 events 도 불필요).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: leaderelection
  namespace: snippetgo-leaderelection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leaderelection
  namespace: snippetgo-leaderelection
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leaderelection
  namespace: snippetgo-leaderelection
subjects:
  - kind: ServiceAccount
    name: leaderelection
    namespace: snippetgo-leaderelection
roleRef:
  kind: Role
  name: leaderelection
  apiGroup: rbac.authorization.k8s.io
