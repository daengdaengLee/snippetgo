# 리더 선출(resourcelock.LeaseLock)은 단일 Lease 오브젝트에 대해 get(상태 확인)/
# create(최초 생성)/update(갱신, 반납) 만 한다. list/watch/patch 는 쓰지 않으므로 넣지 않는다.
# coordination.k8s.io 의 leases 에 대한 이 세 권한만 있으면 되고, EventRecorder 를 안 써서
# events 권한도 필요 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: leaderelection
  namespace: snippetgo-leaderelection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leaderelection
  namespace: snippetgo-leaderelection
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leaderelection
  namespace: snippetgo-leaderelection
subjects:
  - kind: ServiceAccount
    name: leaderelection
    namespace: snippetgo-leaderelection
roleRef:
  kind: Role
  name: leaderelection
  apiGroup: rbac.authorization.k8s.io
